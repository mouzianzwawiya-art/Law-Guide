<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#155e52"><title>Law Guide</title><style>@import url("https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap");*{box-sizing:border-box}body{margin:0;background:#e9e6df;font-family:Cairo,Arial;color:#18332e}.app{max-width:430px;min-height:100vh;margin:auto;background:#fafaf8;padding-bottom:74px}header{height:64px;background:#fff;border-bottom:1px solid #e5e9e6;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:3}header button{border:0;background:none;font-size:25px;color:#18332e}main{padding:18px}.hero{min-height:360px;border-radius:26px;padding:26px;background:linear-gradient(160deg,#dcebe5,#f3f0e8);display:flex;flex-direction:column;justify-content:flex-end}.logo{width:70px;height:70px;border-radius:18px;background:#155e52;color:white;display:grid;place-items:center;font-size:38px;margin-bottom:15px}.hero h1{font-size:38px;margin:0}.hero h2{font-size:19px;margin:0}.hero p{color:#526761;line-height:1.8}.primary,.secondary{width:100%;border-radius:15px;padding:13px;border:0;font-weight:700;cursor:pointer}.primary{background:#155e52;color:#fff}.secondary{background:#fff;color:#155e52;border:1px solid #155e52}.login{text-align:center;color:#155e52;font-weight:700;padding:12px}.title{margin:22px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.item,.box{background:#fff;border:1px solid #e5e9e6;border-radius:17px;padding:16px;box-shadow:0 3px 12px #00000008}.card{cursor:pointer}.ico{font-size:27px}.muted{color:#71817c;font-size:12px}.item{display:flex;gap:12px;align-items:center;margin:10px 0;cursor:pointer}.round{width:42px;height:42px;border-radius:12px;background:#e8f0eb;display:grid;place-items:center;font-size:21px}.grow{flex:1}.back{border:0;background:none;color:#155e52;font-weight:700;padding:5px 0 14px}.steps{display:flex;justify-content:space-between;margin:5px 0 20px}.step{text-align:center;color:#9aa7a3;font-size:10px}.step i{display:block;width:23px;height:23px;border-radius:50%;background:#e1e8e4;margin:auto auto 5px}.step.on{color:#155e52;font-weight:700}.step.on i{background:#155e52;border:5px solid white;box-shadow:0 0 0 1px #155e52}.choice{display:block;border:1px solid #e5e9e6;padding:12px;border-radius:13px;margin:8px 0}.doc{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #e5e9e6}.doc input{accent-color:#155e52}.timeline .item{box-shadow:none}.source{background:#eef4f0;padding:15px;border-radius:15px;margin-top:12px}.actions{display:flex;gap:10px;margin-top:18px}.actions>*{flex:1}nav{position:fixed;bottom:0;width:min(100%,430px);height:72px;background:#fff;border-top:1px solid #e5e9e6;display:flex;justify-content:space-around;z-index:4}nav button{border:0;background:none;color:#71817c;font-size:21px}nav small{display:block;font-size:10px}#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#18332e;color:#fff;padding:9px 15px;border-radius:12px;opacity:0;z-index:8}#toast.show{opacity:1}input.search{width:100%;padding:14px;border:1px solid #e5e9e6;border-radius:15px}</style></head><body><div class="app"><header><button onclick="toast('القائمة')">☰</button><b>⚖ Law Guide</b><button onclick="search()">⌕</button></header><main id="screen"></main><nav><button onclick="home()">⌂<small>الرئيسية</small></button><button onclick="saved()">♡<small>محفوظاتي</small></button><button onclick="guide()">▣<small>Law Guideاتي</small></button><button onclick="profile()">♙<small>حسابي</small></button></nav></div><div id="toast"></div><script>const S=document.getElementById("screen");const cats=[["🏢","إنشاء مؤسسة"],["🏠","العقار والتعمير"],["🏗️","رخص البناء"],["📄","الوثائق الإدارية"],["⚖️","الطعون والنزاعات"],["📝","العقود"],["👷","العمل والتوظيف"],["👨‍👩‍👧","الأحوال الشخصية"]];const docs=["طلب رخصة بناء","وثيقة الملكية","مخطط الموقع","الملف التقني للمشروع","وثائق إضافية حسب طبيعة المشروع"];function toast(x){let t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400)}function home(){S.innerHTML=`<section class="hero"><div class="logo">⚖</div><h1>Law Guide</h1><h2>Law Guide · Law Guide</h2><p>اعرف خطوتك القانونية.<br>من الLaw Guide الذي تبحث عنه إلى آخر خطوة، بطريقة بسيطة وواضحة.</p><button class="primary" onclick="categories()">ابدأ الآن →</button><div class="login">تسجيل الدخول</div></section><h3 class="title">الأكثر استعمالًا</h3><div class="grid">${cats.slice(0,6).map((c,i)=>`<div class="card" onclick="cat(${i})"><div class="ico">${c[0]}</div><b>${c[1]}</b><div class="muted">استكشف الLaw Guideات</div></div>`).join("")}</div><h3 class="title">كيف يعمل Law Guide؟</h3><div class="box">1 — اختر الLaw Guide<br>↓<br>2 — اكتشف الوثائق والخطوات<br>↓<br>3 — تابع تقدمك</div>`}function categories(){S.innerHTML=`<button class="back" onclick="home()">‹ العودة</button><h1>اختر المجال</h1><p class="muted">وش حاب تدير؟</p><div class="grid">${cats.map((c,i)=>`<div class="card" onclick="cat(${i})"><div class="ico">${c[0]}</div><b>${c[1]}</b></div>`).join("")}</div>`}function cat(i){if(i==1||i==2){S.innerHTML=`<button class="back" onclick="categories()">‹ العودة</button><h1>العقار والتعمير</h1><p class="muted">اختر الLaw Guide الذي تريد معرفة خطواته.</p><div class="item" onclick="questions()"><div class="round">🏗️</div><div class="grow"><b>رخصة البناء</b><small class="muted">الوثائق والمراحل الأساسية</small></div>›</div><div class="item" onclick="toast('سيضاف بالمصادر الرسمية')"><div class="round">📐</div><div class="grow"><b>شهادة التعمير</b></div>›</div><div class="item" onclick="toast('سيضاف بالمصادر الرسمية')"><div class="round">🗺️</div><div class="grow"><b>التقسيم العقاري</b></div>›</div>`}else toast("سيضاف هذا المجال بالمصادر الرسمية")};function bar(n){return`<div class="steps">${["الأسئلة","الوثائق","المراحل","المصدر"].map((x,i)=>`<div class="step ${i<=n?"on":""}"><i></i>${x}</div>`).join("")}</div>`}function questions(){S.innerHTML=`<button class="back" onclick="cat(1)">‹ العودة</button>${bar(0)}<h1>رخصة البناء</h1><p class="muted">أجب عن الأسئلة لنخصص لك المسار.</p><div class="box"><b>هل أنت مالك العقار؟</b><label class="choice">◉ نعم، أنا المالك</label><label class="choice">○ لا، أمثل المالك</label></div><div class="box"><b>هل لديك مخطط للمشروع؟</b><label class="choice">○ نعم</label><label class="choice">○ لا</label></div><button class="primary" onclick="documents()">التالي →</button>`}function documents(){S.innerHTML=`<button class="back" onclick="questions()">‹ العودة</button>${bar(1)}<h1>الوثائق المطلوبة</h1><p class="muted">علّم الوثائق التي حضرتها.</p><div class="box">${docs.map(x=>`<label class="doc"><input type="checkbox"> <span>${x}</span></label>`).join("")}</div><div class="source">💡 قد تختلف بعض الوثائق حسب طبيعة المشروع ومكانه. تحقق دائمًا من المصدر الرسمي.</div><div class="actions"><button class="secondary" onclick="questions()">السابق</button><button class="primary" onclick="timeline()">التالي →</button></div>`}function timeline(){let a=["تحضير الوثائق","إيداع الملف لدى الجهة المختصة","دراسة الملف","استلام القرار"];S.innerHTML=`<button class="back" onclick="documents()">‹ العودة</button>${bar(2)}<h1>متابعة الLaw Guide</h1><p class="muted">خريطة طريقك من التحضير إلى القرار.</p><div class="timeline">${a.map((x,i)=>`<div class="item"><div class="round">${i==0?"✓":i+1}</div><div class="grow"><b>${x}</b><small class="muted">${i==0?"مكتملة":i==1?"الخطوة التالية":"سيتم تحديث الحالة هنا"}</small></div></div>`).join("")}</div><div class="source"><b>📁 رقم متابعة تجريبي</b><br>RP-2026-4587</div><button class="primary" onclick="legal()">عرض الأساس القانوني</button>`}function legal(){S.innerHTML=`<button class="back" onclick="timeline()">‹ العودة</button>${bar(3)}<h1>الأساس القانوني</h1><div class="box"><b>الإطار القانوني</b><p class="muted">النصوص القانونية والتنظيمية المتعلقة بالتعمير ورخص البناء — محتوى توضيحي للـPrototype.</p><button class="secondary" onclick="toast('سيُربط بالمصدر الرسمي')">عرض النصوص القانونية ↗</button></div><div class="source">📅 آخر تحديث: 12 أكتوبر 2026</div><div class="source">⚠️ Law Guide يقدم معلومات وتوجيهًا عامًا ولا يستبدل الاستشارة القانونية المهنية.</div><button class="primary" onclick="localStorage.saved=1;toast('تم حفظ الLaw Guide ✓')">♡ حفظ الLaw Guide</button>`}function saved(){S.innerHTML=`<h1>محفوظاتي</h1>${localStorage.saved?`<div class="item" onclick="legal()"><div class="round">🏗️</div><div class="grow"><b>رخصة البناء</b><small class="muted">العقار والتعمير</small></div>›</div>`:`<div class="box" style="text-align:center">♡<br><b>لا توجد Law Guideات محفوظة بعد</b></div>`}`}function guide(){timeline()}function profile(){S.innerHTML=`<h1>حسابي</h1><div class="item"><div class="round">👤</div><div class="grow"><b>البيانات الشخصية</b><small class="muted">سيتم إضافتها لاحقًا</small></div>›</div><div class="item"><div class="round">🔔</div><div class="grow"><b>التنبيهات</b><small class="muted">تحديثات الLaw Guideات</small></div>›</div>`}function search(){S.innerHTML=`<h1>البحث</h1><p class="muted">اكتب ما تريد القيام به بلغة بسيطة.</p><input class="search" placeholder="مثال: أريد بناء منزل"><h3 class="title">اقتراحات</h3><div class="grid">${cats.map((c,i)=>`<div class="card" onclick="cat(${i})">${c[0]}<br><b>${c[1]}</b></div>`).join("")}</div>`}home();</script></body></html>
